<!doctype html><html lang=tl><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>SOE Bible Quiz — Host</title><link rel=stylesheet href=css/style.css><style>.qnav{margin:16px 0 18px;padding:14px;background:#0b1220;border:1px solid #2b3850;border-radius:14px}.qnav-title{font-size:14px;font-weight:900;letter-spacing:.08em;color:#9eb3d6;margin:0 0 10px}.qnav-buttons{display:grid;grid-template-columns:repeat(13,minmax(42px,1fr));gap:7px}.qnav-btn{margin:0;padding:9px 5px;border-radius:9px;background:#2464bd;font-weight:900}.qnav-btn:hover:not(:disabled){background:#347fe5;transform:translateY(-1px)}.qnav-btn.active{outline:3px solid #ffd84a;box-shadow:0 0 0 1px #172033}.qnav-btn.done{background:#273244;color:#7d8798;text-decoration:line-through}.qnav-btn:disabled{cursor:not-allowed;opacity:.42}.end-quiz{display:block;width:100%;margin:12px 0 0;background:#b92e3f!important;color:#fff;font-weight:900;letter-spacing:.04em}.end-quiz:disabled{background:#3b2730!important}@media(max-width:700px){.qnav-buttons{grid-template-columns:repeat(8,minmax(38px,1fr))}}</style><body><div id=app></div><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script src=js/groups.js></script><script src=js/qcheck.js></script><script src=js/host.js></script>
